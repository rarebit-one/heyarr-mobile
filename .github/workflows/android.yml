name: android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# The workflow token only needs to read the repo and pull the private
# `voidbind-client` artifact from the same org's GitHub Packages.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Gradle resolves `one.rarebit.voidbind:voidbind-client` from GitHub Packages
    # (settings.gradle.kts) with these credentials.
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: heyarr-mobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
